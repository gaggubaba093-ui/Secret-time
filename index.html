<html lang="en">
<head>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#06151d;
 color:#fff;
 font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.authBox{
 width:100%;
 max-width:450px;
 border:1px solid #10bde9;
 border-radius:28px;
 padding:28px;
 background:#08202a;
 box-shadow:0 0 35px #003b4d;
}
.logo{
 width:80px;height:80px;
 border:3px solid #16c7ff;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:auto;
 font-size:28px;
}
h1{text-align:center;margin:18px 0 8px}
.subtitle{
 text-align:center;
 color:#9bb0bb;
 margin-bottom:25px;
}
input{
 width:100%;
 padding:17px;
 margin:7px 0;
 border-radius:17px;
 border:1px solid #15516a;
 background:#06151d;
 color:#fff;
 outline:none;
}
input:focus{border-color:#18c9ff}
.mainBtn{
 width:100%;
 padding:17px;
 border:0;
 border-radius:17px;
 background:linear-gradient(90deg,#10bde9,#00d1a7);
 color:white;
 font-weight:bold;
 margin-top:8px;
}
.switch{
 text-align:center;
 margin-top:18px;
 color:#9bb0bb;
}
.switch span{
 color:#18c9ff;
 cursor:pointer;
}
.error{
 color:#ff7183;
 text-align:center;
 margin-top:15px;
}

.app{
 min-height:100vh;
}
.top{
 height:110px;
 display:flex;
 align-items:center;
 gap:15px;
 padding:15px 20px;
 background:#08232e;
 border-bottom:1px solid #154c5c;
}
.profileImg{
 width:70px;
 height:70px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #12c4fa;
 background:#0b3342;
}
.topInfo{flex:1}
.topInfo h2{margin:0 0 5px}
.online{color:#8dd44f}
.offline{color:#777}

.logout{
 width:55px;
 height:55px;
 border-radius:16px;
 border:1px solid #15546a;
 background:#092d39;
 color:white;
 font-size:22px;
}

.search{
 padding:14px 16px;
}
.search input{
 margin:0;
 border-radius:30px;
}

.stories{
 display:flex;
 gap:16px;
 padding:15px 18px;
 overflow-x:auto;
 border-bottom:1px solid #164351;
}
.story{
 min-width:80px;
 text-align:center;
}
.storyCircle{
 width:70px;
 height:70px;
 border-radius:50%;
 border:3px solid #13c6ff;
 overflow:hidden;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#092d3b;
}
.storyCircle img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.storyCircle.add{
 font-size:38px;
 color:#fff;
}
.storyName{
 font-size:12px;
 margin-top:6px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.users{
 padding-bottom:90px;
}
.user{
 display:flex;
 align-items:center;
 gap:14px;
 padding:14px 20px;
 border-bottom:1px solid #11323d;
}
.user:active{background:#0b2732}
.userImg{
 width:58px;
 height:58px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #16c7ff;
 background:#0b3342;
}
.userInfo{flex:1}
.userInfo b{font-size:18px}
.status{font-size:13px;margin-top:4px}

.chat{
 position:fixed;
 inset:0;
 background:#06151d;
 z-index:20;
 display:flex;
 flex-direction:column;
}
.chatHeader{
 min-height:82px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 14px;
 background:#082832;
 border-bottom:1px solid #175064;
}
.back{
 width:42px;
 height:42px;
 border:0;
 background:none;
 color:#fff;
 font-size:30px;
}
.chatAvatar{
 width:50px;
 height:50px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #16c7ff;
}
.chatUser{flex:1}
.chatUser b{display:block;font-size:17px}
.chatUser small{color:#9fb5bd}

.messages{
 flex:1;
 overflow-y:auto;
 padding:15px;
 display:flex;
 flex-direction:column;
 gap:8px;
}
.msg{
 max-width:82%;
 padding:10px 13px;
 border-radius:17px;
 word-wrap:break-word;
}
.mine{
 align-self:flex-end;
 background:#075c50;
 border-bottom-right-radius:4px;
}
.theirs{
 align-self:flex-start;
 background:#17303a;
 border-bottom-left-radius:4px;
}
.msg img{
 max-width:230px;
 border-radius:12px;
 display:block;
}
.msg audio{
 max-width:230px;
}
.time{
 display:block;
 font-size:10px;
 color:#b9c9ce;
 margin-top:5px;
 text-align:right;
}
.empty{
 text-align:center;
 color:#7e969e;
 margin:auto;
}

.composer{
 display:flex;
 align-items:center;
 gap:7px;
 padding:9px;
 background:#081e27;
 border-top:1px solid #173f4b;
}
.iconBtn{
 width:48px;
 height:48px;
 border-radius:50%;
 border:1px solid #145267;
 background:#082b37;
 color:#fff;
 font-size:21px;
 flex-shrink:0;
}
.messageInput{
 flex:1;
 margin:0;
 border-radius:25px;
 padding:14px 16px;
}
.send{
 background:#00c9a7;
 border:0;
 color:#fff;
}

#fileInput,#avatarInput,#storyInput{display:none}

.storyViewer{
 position:fixed;
 inset:0;
 z-index:50;
 background:#000;
 display:flex;
 align-items:center;
 justify-content:center;
}
.storyViewer img{
 max-width:100%;
 max-height:100%;
 object-fit:contain;
}
.closeStory{
 position:absolute;
 top:20px;
 right:20px;
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:#333;
 color:#fff;
 font-size:25px;
}

.profilePanel{
 position:fixed;
 inset:0;
 background:#06151d;
 z-index:40;
 padding:25px;
 overflow:auto;
}
.profilePanel h2{text-align:center}
.bigProfile{
 display:block;
 width:130px;
 height:130px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid #16c7ff;
 margin:25px auto;
}
.profileBtn{
 width:100%;
 padding:15px;
 border:1px solid #15566b;
 background:#092b36;
 color:white;
 border-radius:15px;
 margin-top:10px;
}
.closeProfile{
 position:absolute;
 right:18px;
 top:18px;
 background:none;
 color:white;
 border:0;
 font-size:30px;
}
</style>

<body>

<!-- AUTH -->
<section id="authPage" class="auth">
<div class="authBox">

<div class="logo">AD</div>
<h1>💬 Arslan Ki Duniya</h1>
<div class="subtitle">Create your account and start chatting</div>

<div id="signupForm">
<input id="signupName" type="text" placeholder="Your Name" autocomplete="name">
<input id="signupEmail" type="email" placeholder="Email" autocomplete="email">
<input id="signupPassword" type="password" placeholder="Password" autocomplete="new-password">
<button id="signupBtn" class="mainBtn">Create Account</button>

<div class="switch">
Already have an account?
<span id="showLogin">Login</span>
</div>
</div>

<div id="loginForm" class="hidden">
<input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
<input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" class="mainBtn">Login</button>

<div class="switch">
New user?
<span id="showSignup">Sign Up</span>
</div>
</div>

<div id="authError" class="error"></div>

</div>
</section>


<!-- MAIN APP -->
<section id="app" class="app hidden">

<div class="top">

<img id="myAvatar" class="profileImg" src="" alt="Profile">

<div class="topInfo">
<h2>Arslan Ki Duniya</h2>
<div>
<span id="myOnline" class="online">🟢 Online</span>
</div>
</div>

<button id="profileBtn" class="logout">👤</button>
<button id="logoutBtn" class="logout">↪</button>

</div>


<div class="search">
<input id="searchUsers" type="search" placeholder="🔍 Search users">
</div>


<!-- STORIES -->
<div id="stories" class="stories">

<div class="story" id="addStory">
<div class="storyCircle add">+</div>
<div class="storyName">My Story</div>
</div>

</div>


<!-- USERS -->
<div id="users" class="users"></div>

</section>


<!-- CHAT -->
<section id="chat" class="chat hidden">

<div class="chatHeader">

<button id="closeChatButton" class="back">‹</button>

<img id="chatAvatar" class="chatAvatar" src="" alt="">

<div class="chatUser">
<b id="chatName">User</b>
<small id="chatStatus">Offline</small>
</div>

</div>

<div id="messages" class="messages">
<div class="empty">Start chatting 💬</div>
</div>

<div class="composer">

<button id="cameraBtn" class="iconBtn">📷</button>

<button id="attachBtn" class="iconBtn">📎</button>

<button id="micBtn" class="iconBtn">🎙️</button>

<input
id="messageInput"
class="messageInput"
type="text"
placeholder="Message..."
autocomplete="off">

<button id="sendBtn" class="iconBtn send">➤</button>

<input id="fileInput" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.txt">

</div>

</section>


<!-- PROFILE -->
<section id="profilePanel" class="profilePanel hidden">

<button id="closeProfile" class="closeProfile">×</button>

<h2>My Profile</h2>

<img id="bigProfile" class="bigProfile" src="" alt="Profile">

<button id="changePhotoBtn" class="profileBtn">
📷 Change Profile Photo
</button>

<input id="avatarInput" type="file" accept="image/*">

<input id="newName" type="text" placeholder="Your name">

<button id="saveNameBtn" class="profileBtn">
💾 Save Name
</button>

<button id="profileLogoutBtn" class="profileBtn">
🚪 Logout
</button>

</section>


<!-- STORY VIEWER -->
<section id="storyViewer" class="storyViewer hidden">

<button id="closeStory" class="closeStory">×</button>

<img id="storyImage" src="" alt="Story">

</section>


<script>

/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAm8dFzdvdQSi0sQ7Iup5d693Mhy_qW1k",
  authDomain: "assalam-ke-bhanja.firebaseapp.com",
  databaseURL: "https://assalam-ke-bhanja-default-rtdb.firebaseio.com",
  projectId: "assalam-ke-bhanja",
  storageBucket: "assalam-ke-bhanja.firebasestorage.app",
  messagingSenderId: "78055595634",
  appId: "1:78055595634:web:494f2094a976073402b7eb",
  measurementId: "G-8EKSDNRXRT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();


/* =========================================================
   VARIABLES
   ========================================================= */

let currentUser = null;
let currentProfile = null;
let selectedUser = null;
let messagesRef = null;
let recorder = null;
let audioChunks = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const authPage = document.getElementById("authPage");
const app = document.getElementById("app");
const chat = document.getElementById("chat");

const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");

const authError = document.getElementById("authError");


/* =========================================================
   AUTH SWITCH
   ========================================================= */

document.getElementById("showLogin").onclick = () => {
  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
  authError.textContent = "";
};

document.getElementById("showSignup").onclick = () => {
  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");
  authError.textContent = "";
};


/* =========================================================
   SIGN UP
   ========================================================= */

document.getElementById("signupBtn").onclick = async () => {

  const name = (document.getElementById("signupName").value || "").trim();
  const email = (document.getElementById("signupEmail").value || "").trim();
  const password = document.getElementById("signupPassword").value || "";

  authError.textContent = "";

  if(!name){
    authError.textContent = "Please enter your name.";
    return;
  }

  if(!email){
    authError.textContent = "Please enter your email.";
    return;
  }

  if(password.length < 6){
    authError.textContent = "Password must be at least 6 characters.";
    return;
  }

  try{

    const result =
      await auth.createUserWithEmailAndPassword(email,password);

    const user = result.user;

    await db.ref("users/"+user.uid).set({
      uid:user.uid,
      name:name,
      email:email,
      photo:"",
      online:true,
      createdAt:firebase.database.ServerValue.TIMESTAMP,
      lastSeen:firebase.database.ServerValue.TIMESTAMP
    });

  }catch(error){

    console.error(error);
    authError.textContent = firebaseError(error);

  }

};


/* =========================================================
   LOGIN
   ========================================================= */

document.getElementById("loginBtn").onclick = async () => {

  const email = (document.getElementById("loginEmail").value || "").trim();
  const password = document.getElementById("loginPassword").value || "";

  authError.textContent = "";

  if(!email || !password){
    authError.textContent = "Email and password required.";
    return;
  }

  try{

    await auth.signInWithEmailAndPassword(email,password);

  }catch(error){

    console.error(error);
    authError.textContent = firebaseError(error);

  }

};


/* =========================================================
   FIREBASE AUTH STATE
   ========================================================= */

auth.onAuthStateChanged(async user => {

  if(user){

    currentUser = user;

    authPage.classList.add("hidden");
    app.classList.remove("hidden");

    await loadMyProfile();

    setOnline();

    loadUsers();

    loadStories();

    requestNotificationPermission();

  }else{

    currentUser = null;

    app.classList.add("hidden");
    chat.classList.add("hidden");
    authPage.classList.remove("hidden");

  }

});


/* =========================================================
   LOAD MY PROFILE
   ========================================================= */

async function loadMyProfile(){

  const snap =
    await db.ref("users/"+currentUser.uid).once("value");

  currentProfile = snap.val();

  if(!currentProfile){

    currentProfile = {
      uid:currentUser.uid,
      name:currentUser.email.split("@")[0],
      email:currentUser.email,
      photo:""
    };

    await db.ref("users/"+currentUser.uid).set(currentProfile);

  }

  updateMyUI();

}


function updateMyUI(){

  const photo =
    currentProfile.photo ||
    avatar(currentProfile.name);

  document.getElementById("myAvatar").src = photo;

  document.getElementById("bigProfile").src = photo;

  document.getElementById("newName").value =
    currentProfile.name || "";

}


/* =========================================================
   ONLINE / OFFLINE
   ========================================================= */

function setOnline(){

  const ref = db.ref("users/"+currentUser.uid);

  const connected = db.ref(".info/connected");

  connected.on("value",snap => {

    if(snap.val() === true){

      ref.update({
        online:true,
        lastSeen:firebase.database.ServerValue.TIMESTAMP
      });

      ref.onDisconnect().update({
        online:false,
        lastSeen:firebase.database.ServerValue.TIMESTAMP
      });

    }

  });

}


/* =========================================================
   LOAD USERS
   ========================================================= */

function loadUsers(){

  db.ref("users").on("value",snap => {

    const usersBox =
      document.getElementById("users");

    usersBox.innerHTML = "";

    const search =
      (document.getElementById("searchUsers").value || "")
      .toLowerCase()
      .trim();

    const list = [];

    snap.forEach(child => {

      const u = child.val();

      if(!u || u.uid === currentUser.uid)
        return;

      if(search &&
         !(u.name || "").toLowerCase().includes(search))
        return;

      list.push(u);

    });

    list.sort((a,b) =>
      (a.name || "").localeCompare(b.name || "")
    );

    if(list.length === 0){

      usersBox.innerHTML =
        '<div class="empty">No users found</div>';

      return;

    }

    list.forEach(u => {

      const row =
        document.createElement("div");

      row.className = "user";

      row.innerHTML = `
        <img class="userImg"
             src="${u.photo || avatar(u.name)}">

        <div class="userInfo">
          <b>${escapeHtml(u.name || "User")}</b>
          <div class="status ${u.online ? "online":"offline"}">
            ${u.online ? "🟢 Online" : "⚫ Offline"}
          </div>
        </div>
      `;

      row.onclick = () => openChat(u);

      usersBox.appendChild(row);

    });

  });

}


document.getElementById("searchUsers").oninput =
  loadUsers;


/* =========================================================
   OPEN CHAT
   ========================================================= */

function openChat(user){

  selectedUser = user;

  chat.classList.remove("hidden");

  document.getElementById("chatName").textContent =
    user.name || "User";

  document.getElementById("chatAvatar").src =
    user.photo || avatar(user.name);

  updateChatStatus(user);

  loadMessages();

}


/* =========================================================
   CHAT STATUS
   ========================================================= */

function updateChatStatus(user){

  document.getElementById("chatStatus").textContent =
    user.online
      ? "🟢 Online"
      : "Last seen " + timeAgo(user.lastSeen);

}


/* =========================================================
   CHAT ROOM ID
   ========================================================= */

function chatId(a,b){

  return [a,b].sort().join("_");

}


/* =========================================================
   LOAD MESSAGES
   ========================================================= */

function loadMessages(){

  const box =
    document.getElementById("messages");

  box.innerHTML = "";

  if(messagesRef){
    messagesRef.off();
  }

  const id =
    chatId(currentUser.uid,selectedUser.uid);

  messagesRef =
    db.ref("messages/"+id).limitToLast(200);

  messagesRef.on("child_added",snap => {

    const m = snap.val();

    if(!m) return;

    const empty = box.querySelector(".empty");

    if(empty) empty.remove();

    renderMessage(m);

    box.scrollTop = box.scrollHeight;

  });

}


/* =========================================================
   RENDER MESSAGE
   ========================================================= */

function renderMessage(m){

  const box =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className =
    "msg " +
    (m.sender === currentUser.uid
      ? "mine"
      : "theirs");

  let content = "";

  if(m.type === "image"){

    content =
      `<img src="${m.url}" alt="photo">`;

  }else if(m.type === "video"){

    content =
      `<video src="${m.url}"
              controls
              style="max-width:230px;border-radius:12px"></video>`;

  }else if(m.type === "audio"){

    content =
      `<audio src="${m.url}" controls></audio>`;

  }else if(m.type === "file"){

    content =
      `<a href="${m.url}"
          target="_blank"
          style="color:#4dd9ff">
          📎 ${escapeHtml(m.name || "File")}
       </a>`;

  }else{

    content =
      escapeHtml(m.text || "");

  }

  div.innerHTML =
    content +
    `<span class="time">${formatTime(m.time)}</span>`;

  box.appendChild(div);

}


/* =========================================================
   SEND TEXT MESSAGE
   ========================================================= */

async function sendMessage(){

  if(!currentUser || !selectedUser)
    return;

  const input =
    document.getElementById("messageInput");

  const text =
    (input.value || "").trim();

  if(!text)
    return;

  const id =
    chatId(currentUser.uid,selectedUser.uid);

  const ref =
    db.ref("messages/"+id).push();

  await ref.set({

    id:ref.key,

    sender:currentUser.uid,

    receiver:selectedUser.uid,

    text:text,

    type:"text",

    time:firebase.database.ServerValue.TIMESTAMP

  });

  input.value = "";

}


document.getElementById("sendBtn").onclick =
  sendMessage;

document.getElementById("messageInput")
  .addEventListener("keydown",e => {

    if(e.key === "Enter"){
      e.preventDefault();
      sendMessage();
    }

  });


/* =========================================================
   UPLOAD FILE / PHOTO
   ========================================================= */

document.getElementById("attachBtn").onclick = () => {

  document.getElementById("fileInput").click();

};


document.getElementById("cameraBtn").onclick = () => {

  const input =
    document.getElementById("fileInput");

  input.accept = "image/*";
  input.setAttribute("capture","environment");

  input.click();

};


document.getElementById("fileInput").onchange =
  async e => {

    const file = e.target.files[0];

    if(!file || !selectedUser)
      return;

    try{

      const path =
        "chatFiles/" +
        currentUser.uid + "/" +
        Date.now() + "_" +
        file.name;

      const task =
        storage.ref(path).put(file);

      const snap =
        await task;

      const url =
        await snap.ref.getDownloadURL();

      let type = "file";

      if(file.type.startsWith("image/"))
        type = "image";

      if(file.type.startsWith("video/"))
        type = "video";

      const id =
        chatId(currentUser.uid,selectedUser.uid);

      const ref =
        db.ref("messages/"+id).push();

      await ref.set({

        id:ref.key,

        sender:currentUser.uid,

        receiver:selectedUser.uid,

        url:url,

        name:file.name,

        type:type,

        time:firebase.database.ServerValue.TIMESTAMP

      });

    }catch(error){

      alert("File upload failed: " + error.message);

    }

    e.target.value = "";

  };


/* =========================================================
   VOICE RECORDING
   ========================================================= */

document.getElementById("micBtn").onclick =
  async () => {

    if(recorder && recorder.state === "recording"){

      recorder.stop();

      document.getElementById("micBtn").textContent = "🎙️";

      return;

    }

    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });

      audioChunks = [];

      recorder =
        new MediaRecorder(stream);

      recorder.ondataavailable =
        e => audioChunks.push(e.data);

      recorder.onstop =
        async () => {

          stream.getTracks().forEach(t => t.stop());

          const blob =
            new Blob(audioChunks,{
              type:"audio/webm"
            });

          await sendAudio(blob);

        };

      recorder.start();

      document.getElementById("micBtn").textContent = "⏹️";

      setTimeout(() => {

        if(recorder &&
           recorder.state === "recording"){

          recorder.stop();

          document.getElementById("micBtn").textContent = "🎙️";

        }

      },30000);

    }catch(error){

      alert("Microphone permission required.");

    }

  };


async function sendAudio(blob){

  if(!selectedUser)
    return;

  try{

    const path =
      "voice/" +
      currentUser.uid + "/" +
      Date.now() + ".webm";

    const snap =
      await storage.ref(path).put(blob);

    const url =
      await snap.ref.getDownloadURL();

    const id =
      chatId(currentUser.uid,selectedUser.uid);

    const ref =
      db.ref("messages/"+id).push();

    await ref.set({

      id:ref.key,

      sender:currentUser.uid,

      receiver:selectedUser.uid,

      url:url,

      type:"audio",

      time:firebase.database.ServerValue.TIMESTAMP

    });

  }catch(error){

    alert("Voice upload failed: " + error.message);

  }

}

    }

    try{

      const path =

      const snap =
        await storage.ref(path).put(file);

        await snap.ref.getDownloadURL();

async function logout(){

    await db.ref("users/"+currentUser.uid)
      .update({
        online:false,
        lastSeen:firebase.database.ServerValue.TIMESTAMP

  await auth.signOut();

}

/* create hidden story input */
const storyInput =
  document.createElement("input");

storyInput.type = "file";
storyInput.accept = "image/*";

document.body.appendChild(storyInput);


storyInput.onchange =
  async e => {

    const file = e.target.files[0];

    if(!file) return;

    try{

      const path =
        "stories/" +
        currentUser.uid + "/" +
        Date.now() + ".jpg";

      const snap =
        await storage.ref(path).put(file);

      const url =
        await snap.ref.getDownloadURL();

      const ref =
        db.ref("stories").push();

      await ref.set({

        id:ref.key,

        uid:currentUser.uid,

        name:currentProfile.name,

        photo:currentProfile.photo || "",

        url:url,

        createdAt:firebase.database.ServerValue.TIMESTAMP,

        expiresAt:Date.now() + 86400000

      });

      alert("Story uploaded.");

      loadStories();

    }catch(error){

      alert("Story upload failed: " + error.message);

    }

    e.target.value = "";

  };


/* =========================================================
   LOAD STORIES
   ========================================================= */

function loadStories(){

  db.ref("stories").on("value",snap => {

    const container =
      document.getElementById("stories");

    container.innerHTML = "";

    const add =
      document.createElement("div");

    add.className = "story";
    add.id = "addStory";

    add.innerHTML = `
      <div class="storyCircle add">+</div>
      <div class="storyName">My Story</div>
    `;

    add.onclick = () =>
      storyInput.click();

    container.appendChild(add);


    const now = Date.now();

    const arr = [];

    snap.forEach(child => {

      const s = child.val();

      if(s && s.expiresAt > now){

        arr.push(s);

      }

    });

    const grouped = {};

    arr.forEach(s => {

      grouped[s.uid] = s;

    });

    Object.values(grouped).forEach(s => {

      const story =
        document.createElement("div");

      story.className = "story";

      story.innerHTML = `
        <div class="storyCircle">
          <img src="${s.photo || avatar(s.name)}">
        </div>
        <div class="storyName">
          ${escapeHtml(s.name || "Story")}
        </div>
      `;

      story.onclick = () => {

        document.getElementById("storyImage").src =
          s.url;

        document.getElementById("storyViewer")
          .classList.remove("hidden");

      };

      container.appendChild(story);

    });

  });

}

    document.getElementById("storyViewer")

    document.getElementById("storyImage").src = "";

/* =========================================================
   HELPER FUNCTIONS
   ========================================================= */

function avatar(name){

  const n =
    (name || "U").trim();

  const letters =
    n.substring(0,2).toUpperCase();

  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(letters) +
    "&background=083746&color=ffffff&size=256";

}


function escapeHtml(text){

  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTime(timestamp){

  if(!timestamp)
    return "";

  const d =
    new Date(timestamp);

  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

}


function timeAgo(timestamp){

  if(!timestamp)
    return "offline";

  const diff =
    Date.now() - timestamp;

  if(diff < 60000)
    return "just now";

  if(diff < 3600000)
    return Math.floor(diff/60000) + " min ago";

  if(diff < 86400000)
    return Math.floor(diff/3600000) + " hr ago";

  return new Date(timestamp)
    .toLocaleDateString();

}


function firebaseError(error){

  const code = error && error.code
    ? error.code
    : "";

  const messages = {

    "auth/email-already-in-use":
      "This email is already registered.",

    "auth/invalid-email":
      "Invalid email address.",

    "auth/weak-password":
      "Password is too weak.",

    "auth/user-not-found":
      "User not found.",

    "auth/wrong-password":
      "Wrong password.",

    "auth/invalid-credential":
      "Invalid email or password.",

    "auth/too-many-requests":
      "Too many attempts. Try again later.",

    "auth/configuration-not-found":
      "Firebase Authentication is not configured correctly."

  };

  return messages[code] ||
    (error && error.message) ||
    "Something went wrong.";

}
