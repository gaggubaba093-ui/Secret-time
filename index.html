<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Chat</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#06131d;
  color:white;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#authPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:420px;
  padding:25px;
  border:1px solid #08c8ff;
  border-radius:24px;
  background:#09202d;
  box-shadow:0 0 30px #008cff33;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border:3px solid #08c8ff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#9bb0bd;
  margin-bottom:20px;
}

input{
  width:100%;
  height:50px;
  margin:6px 0;
  padding:0 15px;
  border-radius:12px;
  border:1px solid #18516c;
  background:#06131d;
  color:white;
  outline:none;
}

input:focus{
  border-color:#08c8ff;
}

.primary{
  width:100%;
  height:50px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#08c8ff,#00c99a);
  color:white;
  font-weight:bold;
}

.switch{
  text-align:center;
  color:#9bb0bd;
  margin-top:18px;
}

.switch button{
  background:none;
  border:0;
  color:#08c8ff;
}

#error{
  color:#ff6878;
  text-align:center;
  min-height:25px;
  margin-top:10px;
}

/* APP */

#app{
  height:100vh;
  display:none;
  flex-direction:column;
}

.header{
  height:70px;
  display:flex;
  align-items:center;
  padding:8px 12px;
  background:#09202d;
  border-bottom:1px solid #16485e;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  border:2px solid #08c8ff;
  background:#103144;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:bold;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.title{
  flex:1;
  margin-left:10px;
}

.title b{
  font-size:19px;
}

.title small{
  display:block;
  color:#8fa8b6;
  margin-top:3px;
}

.icon{
  width:42px;
  height:42px;
  margin-left:5px;
  border:1px solid #15516e;
  border-radius:10px;
  background:#0b2939;
  color:white;
}

.search{
  padding:8px;
}

.search input{
  margin:0;
  border-radius:25px;
}

/* STORIES */

.stories{
  display:flex;
  gap:12px;
  padding:10px;
  overflow-x:auto;
  border-bottom:1px solid #123f52;
}

.story{
  min-width:70px;
  text-align:center;
  font-size:11px;
}

.storyCircle{
  width:62px;
  height:62px;
  margin:auto;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #08c8ff;
  padding:2px;
}

.addStory{
  width:62px;
  height:62px;
  margin:auto;
  border-radius:50%;
  border:2px dashed #08c8ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:#0b2939;
}

/* USERS */

.users{
  flex:1;
  overflow:auto;
}

.user{
  height:78px;
  display:flex;
  align-items:center;
  padding:9px 12px;
  border-bottom:1px solid #103746;
}

.userInfo{
  flex:1;
  margin-left:12px;
}

.userInfo small{
  display:block;
  color:#91aabd;
  margin-top:4px;
}

/* CHAT */

#chat{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:#06131d;
  z-index:50;
}

.chatHeader{
  height:70px;
  display:flex;
  align-items:center;
  padding:8px;
  background:#09202d;
  border-bottom:1px solid #16485e;
}

.back{
  width:40px;
  border:0;
  background:none;
  color:white;
  font-size:32px;
}

.chatUser{
  flex:1;
  margin-left:9px;
}

.chatUser b{
  display:block;
}

.chatUser small{
  color:#91aabd;
}

.messages{
  flex:1;
  overflow:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.message{
  max-width:82%;
  align-self:flex-start;
  padding:9px 11px;
  background:#173246;
  border-radius:15px;
  word-break:break-word;
}

.message.mine{
  align-self:flex-end;
  background:#007c69;
}

.message img,
.message video{
  max-width:100%;
  border-radius:9px;
}

.message audio{
  max-width:240px;
}

.time{
  font-size:9px;
  color:#c1d0d6;
  text-align:right;
  margin-top:4px;
}

.composer{
  display:flex;
  gap:5px;
  padding:7px;
  background:#09202d;
  border-top:1px solid #16485e;
}

.composer input{
  flex:1;
  margin:0;
}

.action{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  border:1px solid #15516e;
  background:#0b2939;
  color:white;
}

.send{
  width:46px;
  height:46px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#00bfa5;
  color:white;
  font-size:19px;
}

/* STORY VIEWER */

#storyViewer{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:100;
}

#storyViewer img,
#storyViewer video{
  max-width:100%;
  max-height:100%;
}

.closeStory{
  position:absolute;
  right:15px;
  top:15px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#ffffff22;
  color:white;
  font-size:22px;
}

/* MOBILE */

@media(max-width:500px){

  .authBox{
    padding:22px;
  }

  .message{
    max-width:88%;
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN / SIGNUP ================= -->

  <div class="authBox">

    <div class="logo">SC</div>

    <h1>💬 Secret Chat</h1>

    <div class="subtitle">
      Create your account and start chatting
    </div>

    <!-- SIGN UP -->

    <div id="signupForm">

      <input
        id="signupName"
        type="text"
        placeholder="Your Name"
        autocomplete="name"
      >

      <input
        id="signupEmail"

      <input
        id="signupPassword"

    <!-- LOGIN -->

    <div id="loginForm" class="hidden">

      <input
        id="loginEmail"
        type="email"

      >

      <input
        id="loginPassword"

      >

      <button

        id="loginButton"
      >

      </button>

      <div class="switch">

        </button>

<!-- ================= APP ================= -->

<section id="app">

  <div class="header">

    <div
      class="avatar"
      id="myAvatar"
    >
      U
    </div>

    <div class="title">

      <b>Secret Chat</b>

      <small id="myStatus">
        Offline
      </small>

    </div>

    <button
      class="icon"
      id="logoutButton"
    >
      ↪
    </button>

  </div>


  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="🔍 Search users"
    >

  </div>


  <div
    id="stories"
    class="stories"
  ></div>


  <div
    id="users"
    class="users"
  ></div>

</section>


<!-- ================= CHAT ================= -->

<section id="chat">

  <div class="chatHeader">

    <button
      class="back"
      id="closeChatButton"
    >
      ‹
    </button>

    <div
     <div class="avatar" id="myAvatar">
  U
   
><div class="avatar" id="myAvatar">
  U
</div>

<input
  type="file"
  id="profilePhotoInput"
  accept="image/*"
  hidden
>
    >
      U
    </div>

    <div class="chatUser">

      <b id="chatName">
        User
      </b>

      <small id="chatStatus">
        Private Chat
      </small>

    </div>

  </div>


  <div
    id="messages"
    class="messages"
  ></div>


  <form
    id="messageForm"
    class="composer"
  >

    <button
      type="button"
      class="action"
      id="photoButton"
    >
      📷
    </button>

    <button
      type="button"
      class="action"
      id="fileButton"
    >
      📎
    </button>

    <button
      type="button"
      class="action"
      id="voiceButton"
    >
      🎤
    </button>

    <input
      id="messageInput"

      placeholder="Message..."
      autocomplete="off"
    >

    <button
      type="submit"

    >
      ➤
    </button>

    <input
      id="photoInput"

<!-- ================= STORY VIEWER ================= -->

<div id="storyViewer">

  <button
    class="closeStory"
    id="closeStoryButton"

    ✕
  </button>

  <div id="storyContent"></div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  updateProfile,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyB7B00ndag8PE78pjLxFg4iok9-9_U5bz0",

  authDomain:
    "secret-frame-698ba.firebaseapp.com",

  databaseURL:
    "https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "secret-frame-698ba",

  storageBucket:
    "secret-frame-698ba.firebasestorage.app",

  messagingSenderId:
    "601470862803",

  appId:
    "1:601470862803:web:3b666e06133804609b9b26"

};


const firebaseApp =
  initializeApp(firebaseConfig);


const auth =
  getAuth(firebaseApp);


const database =
  getDatabase(firebaseApp);


const storage =
  getStorage(firebaseApp);


/* VARIABLES */

let currentUser = null;

let selectedUser = null;

let stopMessageListener = null;


/* DOM */

const authPage =
  document.getElementById("authPage");

const app =
  document.getElementById("app");

const signupForm =
  document.getElementById("signupForm");

const loginForm =
  document.getElementById("loginForm");

const signupName =
  document.getElementById("signupName");

const signupEmail =
  document.getElementById("signupEmail");

const signupPassword =
  document.getElementById("signupPassword");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const errorBox =
  document.getElementById("error");

const usersBox =
  document.getElementById("users");

const storiesBox =
  document.getElementById("stories");

const searchInput =
  document.getElementById("searchInput");

const chat =
  document.getElementById("chat");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const chatName =
  document.getElementById("chatName");

const chatStatus =
  document.getElementById("chatStatus");

const chatAvatar =
  document.getElementById("chatAvatar");

const myAvatar =
  document.getElementById("myAvatar");

const myStatus =
  document.getElementById("myStatus");

const photoInput =
  document.getElementById("photoInput");

const fileInput =
  document.getElementById("fileInput");

const storyViewer =
  document.getElementById("storyViewer");

const storyContent =
  document.getElementById("storyContent");


/* ERROR */

function showError(text){

  errorBox.style.color =
    "#ff6878";

  errorBox.textContent =
    text;

}


/* SHOW LOGIN */

document
.getElementById("showLoginButton")
.addEventListener(
  "click",
  function(){

    signupForm
      .classList
      .add("hidden");

    loginForm
      .classList
      .remove("hidden");

    errorBox.textContent = "";

  }
);


/* SHOW SIGNUP */

document
.getElementById("showSignupButton")
.addEventListener(
  "click",
  function(){

    loginForm
      .classList
      .add("hidden");

    signupForm
      .classList
      .remove("hidden");

    errorBox.textContent = "";

  }
);


/* SIGN UP */

document
.getElementById("signupButton")
.addEventListener(
  "click",
  async function(){

    const name =
      signupName.value.trim();

    const email =
      signupEmail.value.trim();

    const password =
      signupPassword.value.trim();


    if(!name){

      showError(
        "अपना नाम डालें।"
      );

      return;
    }


    if(!email){

      showError(
        "अपना Email डालें।"
      );

      return;
    }


    if(!password){

      showError(
        "Password डालें।"
      );

      return;
    }


    if(password.length < 6){

      showError(
        "Password कम से कम 6 अक्षर का होना चाहिए।"
      );

      return;
    }


    try{

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      await updateProfile(
        result.user,
        {
          displayName:name
        }
      );


      await set(
        ref(
          database,
          "users/" +
          result.user.uid
        ),
        {
          uid:
            result.user.uid,

          name:
            name,

          email:
            email,

          online:
            true,

          createdAt:
            Date.now()
        }
      );


      errorBox.style.color =
        "#00e5a0";

      errorBox.textContent =
        "✅ Account बन गया।";


    }catch(error){

      console.error(error);

      showError(
        firebaseError(error)
      );

    }

  }
);


/* LOGIN */

document
.getElementById("loginButton")
.addEventListener(
  "click",
  async function(){

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value.trim();


    if(!email){

      showError(
        "Email डालें।"
      );

      return;
    }


    if(!password){

      showError(
        "Password डालें।"
      );

      return;
    }


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    }catch(error){

      console.error(error);

      showError(
        firebaseError(error)
      );

    }

  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  async function(user){

    if(user){

      currentUser =
        user;


      authPage.style.display =
        "none";


      app.style.display =
        "flex";


      const name =
        user.displayName ||
        "User";


      myAvatar.textContent =
        name
        .substring(0,2)
        .toUpperCase();


      myStatus.textContent =
        "🟢 Online";


      await set(
        ref(
          database,
          "users/" +
          user.uid +
          "/online"
        ),
        true
      );


      loadUsers();

      loadStories();


    }else{

      currentUser =
        null;


      authPage.style.display =
        "flex";


      app.style.display =
        "none";


      chat.style.display =
        "none";

    }

  }
);


/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  async function(){

    if(currentUser){

      await set(
        ref(
          database,
          "users/" +
          currentUser.uid +
          "/online"
        ),
        false
      );

    }

    await signOut(auth);

  }
);


/* USERS */

function loadUsers(){

  onValue(
    ref(database,"users"),
    function(snapshot){

      usersBox.innerHTML =
        "";

      const data =
        snapshot.val() || {};


      Object.values(data)
      .forEach(
        function(user){

          if(
            !currentUser ||
            user.uid ===
            currentUser.uid
          ){
            return;
          }


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "user";


          row.dataset.name =
            (
              user.name ||
              ""
            )
            .toLowerCase();


          const avatar =
            (
              user.name ||
              "U"
            )
            .substring(
              0,
              2
            )
            .toUpperCase();


          row.innerHTML = `

            <div class="avatar">
              ${escapeHTML(avatar)}
            </div>

            <div class="userInfo">

              <b>
                ${escapeHTML(
                  user.name ||
                  "User"
                )}
              </b>

              <small>
                ${
                  user.online
                  ? "🟢 Online"
                  : "⚫ Offline"
                }
              </small>

            </div>

          `;


          row.addEventListener(
            "click",
            function(){
              openChat(user);
            }
          );


          usersBox.appendChild(
            row
          );

        }
      );

    }
  );

}


/* SEARCH */

searchInput.addEventListener(
  "input",
  function(){

    const query =
      searchInput.value
      .trim()
      .toLowerCase();


    document
      .querySelectorAll(".user")
      .forEach(
        function(user){

          user.style.display =
            user.dataset.name
              .includes(query)
              ? "flex"
              : "none";

        }
      );

  }
);


/* CHAT ID */

function chatId(a,b){

  return [
    a,
    b
  ]
  .sort()
  .join("_");

}


/* OPEN CHAT */

function openChat(user){

  selectedUser =
    user;


  chat.style.display =
    "flex";


  chatName.textContent =
    user.name ||
    "User";


  chatStatus.textContent =
    user.online
    ? "🟢 Online"
    : "⚫ Offline";


  chatAvatar.textContent =
    (
      user.name ||
      "U"
    )
    .substring(
      0,
      2
    )
    .toUpperCase();


  loadMessages();

}


/* LOAD MESSAGES */

function loadMessages(){

  messagesBox.innerHTML =
    "";


  if(stopMessageListener){

    stopMessageListener();

    stopMessageListener =
      null;

  }


  const id =
    chatId(
      currentUser.uid,
      selectedUser.uid
    );


  stopMessageListener =
    onChildAdded(
      ref(
        database,
        "chats/" +
        id
      ),
      function(snapshot){

        const data =
          snapshot.val();


        if(!data)
          return;


        const box =
          document.createElement(
            "div"
          );


        box.className =
          "message " +
          (
            data.sender ===
            currentUser.uid
            ? "mine"
            : ""
          );


        if(
          data.type ===
          "image"
        ){

          box.innerHTML = `

            <img
              src="${data.url}"
              alt="Photo">

            <div class="time">
              ${formatTime(data.time)}
            </div>

          `;

        }

        else if(
          data.type ===
          "video"
        ){

          box.innerHTML = `

            <video
              src="${data.url}"
              controls
              playsinline>
            </video>

            <div class="time">
              ${formatTime(data.time)}
            </div>

          `;

        }

        else if(
          data.type ===
          "audio"
        ){

          box.innerHTML = `

            <audio
              src="${data.url}"
              controls>
            </audio>

            <div class="time">
              ${formatTime(data.time)}
            </div>

          `;

        }

        else if(
          data.type ===
          "file"
        ){

          box.innerHTML = `

            <a
              href="${data.url}"
              target="_blank"
              style="color:white">

              📎
              ${escapeHTML(
                data.name ||
                "File"
              )}

            </a>

            <div class="time">
              ${formatTime(data.time)}
            </div>

          `;

        }

        else{

          box.textContent =
            data.text ||
            "";


          const time =
            document.createElement(
              "div"
            );


          time.className =
            "time";


          time.textContent =
            formatTime(
              data.time
            );


          box.appendChild(
            time
          );

        }


        messagesBox.appendChild(
          box
        );


        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      }
    );

}


/* CLOSE CHAT */

document
.getElementById("closeChatButton")
.addEventListener(
  "click",
  function(){

    if(stopMessageListener){

      stopMessageListener();

      stopMessageListener =
        null;

    }

    selectedUser =
      null;

    chat.style.display =
      "none";

  }
);


/* SEND MESSAGE */

document
.getElementById("messageForm")
.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if(
      !currentUser ||
      !selectedUser
    ){
      return;
    }


    const text =
      messageInput.value.trim();


    if(!text)
      return;


    const id =
      chatId(
        currentUser.uid,
        selectedUser.uid
      );


    await push(
      ref(
        database,
        "chats/" +
        id
      ),
      {
        sender:
          currentUser.uid,

        receiver:
          selectedUser.uid,

        type:
          "text",

        text:
          text,

        time:
          Date.now()
      }
    );


    messageInput.value =
      "";

  }
);

/* UPLOAD FILE */

async function uploadFile(
  file,
  type
){

  if(
    !currentUser ||
    !selectedUser
  ){
    return;
  }


  try{

    const id =
      chatId(
        currentUser.uid,
        selectedUser.uid
      );


    const path =
      "uploads/" +
      id +
      "/" +
      Date.now() +
      "_" +
      file.name;


    const fileRef =
      storageRef(
        storage,
        path
      );


    await uploadBytes(
      fileRef,
      file
    );


    const url =
      await getDownloadURL(
        fileRef
      );


    await push(
      ref(
        database,
        "chats/" +
        id
      ),
      {
        sender:
          currentUser.uid,

        receiver:
          selectedUser.uid,

        type:
          type,

        url:
          url,

        name:
          file.name,

        time:
          Date.now()
      }
    );


  }catch(error){

    console.error(error);

    alert(
      "Upload failed: " +
      error.message
    );

  }

}


/* VOICE */

document
.getElementById("voiceButton")
.addEventListener(
  "click",
  async function(){

    if(!selectedUser){

      alert(
        "पहले किसी user की chat खोलें।"
      );

      return;

    }


    try{

      const stream =
        await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


      const recorder =
        new MediaRecorder(
          stream
        );


      const chunks = [];


      recorder.ondataavailable =
        function(event){

          if(
            event.data.size
          ){

            chunks.push(
              event.data
            );

          }

        };


      recorder.onstop =
        function(){

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          const blob =
            new Blob(
              chunks,
              {
                type:
                  "audio/webm"
              }
            );


          const file =
            new File(
              [blob],
              "voice.webm",
              {
                type:
                  "audio/webm"
              }
            );


          uploadFile(
            file,
            "audio"
          );

        };


      recorder.start();


      alert(
        "🎤 5 सेकंड recording..."
      );


      setTimeout(
        function(){

          if(
            recorder.state ===
            "recording"
          ){

            recorder.stop();

          }

        },
        5000
      );


    }catch(error){

      alert(
        "Microphone permission Allow करें।"
      );

    }

  }
);


/* STORIES */

function loadStories(){

  storiesBox.innerHTML =
    "";


  const add =
    document.createElement(
      "div"
    );


  add.className =
    "story";


  add.innerHTML = `

    <div class="addStory">
      +
    </div>

    <div>
      My Story
    </div>

  `;


  add.addEventListener(
    "click",
    function(){

      const input =
        document.createElement(
          "input"
        );


      input.type =
        "file";


      input.accept =
        "image/*,video/*";


      input.addEventListener(
        "change",
        function(){

          if(
            input.files &&
            input.files[0]
          ){

            uploadStory(
              input.files[0]
            );

          }

        }
      );


      input.click();

    }
  );


  storiesBox.appendChild(
    add
  );


  onValue(
    ref(
      database,
      "stories"
    ),
    function(snapshot){

      const data =
        snapshot.val() || {};


      Object.values(data)
      .forEach(
        function(story){

          if(
            Date.now() -
            story.time >
            86400000
          ){

            return;

          }


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "story";


          item.innerHTML = `

            <img
              class="storyCircle"
              src="${story.url}">

            <div>
              ${escapeHTML(
                story.name ||
                "User"
              )}
            </div>

          `;


          item.addEventListener(
            "click",
            function(){

              viewStory(
                story
              );

            }
          );


          storiesBox.appendChild(
            item
          );

        }
      );

    }
  );

}


/* UPLOAD STORY */

async function uploadStory(file){

  try{

    const path =
      "stories/" +
      currentUser.uid +
      "/" +
      Date.now() +
      "_" +
      file.name;


    const fileRef =
      storageRef(
        storage,
        path
      );


    await uploadBytes(
      fileRef,
      file
    );


    const url =
      await getDownloadURL(
        fileRef
      );


    await push(
      ref(
        database,
        "stories"
      ),
      {

        owner:
          currentUser.uid,

        name:
          currentUser.displayName ||
          "User",

        url:
          url,

        type:
          file.type.startsWith(
            "video/"
          )
          ? "video"
          : "image",

        time:
          Date.now()

      }
    );


    alert(
      "✅ Story uploaded"
    );


  }catch(error){

    alert(
      "Story upload failed: " +
      error.message
    );

  }

}


/* VIEW STORY */

function viewStory(story){

  storyContent.innerHTML =
    "";


  if(
    story.type ===
    "video"
  ){

    const video =
      document.createElement(
        "video"
      );


    video.src =
      story.url;

    video.controls =
      true;

    video.autoplay =
      true;

    video.playsInline =
      true;


    storyContent.appendChild(
      video
    );

  }else{

    const image =
      document.createElement(
        "img"
      );


    image.src =
      story.url;


    storyContent.appendChild(
      image
    );

  }


  storyViewer.style.display =
    "flex";

}


/* CLOSE STORY */

document
.getElementById("closeStoryButton")
.addEventListener(
  "click",
  function(){

    storyViewer.style.display =
      "none";

    storyContent.innerHTML =
      "";

  }
);


/* HELPERS */

function formatTime(time){

  return new Date(
    time || Date.now()
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHTML(text){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function firebaseError(error){

  if(
    error.code ===
    "auth/email-already-in-use"
  ){

    return "यह Email पहले से registered है।";

  }

  if(
    error.code ===
    "auth/invalid-email"
  ){

    return "Email सही नहीं है।";

  }

  if(
    error.code ===
    "auth/invalid-credential"
  ){

    return "Email या Password गलत है।";

  }

  if(
    error.code ===
    "auth/weak-password"
  ){

    return "Password कम से कम 6 अक्षर का रखें।";

  }

  if(
    error.code ===
    "auth/network-request-failed"
  ){

    return "Internet connection check करें।";

  }

  return (
    error.message ||
    "कुछ समस्या हुई।"
  );

}
