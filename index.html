/* =========================
   HELPERS
========================= */

function $(id){
return document.getElementById(id);
}

function esc(x){

return String(x??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}

function initials(name){

return String(name||"U")
.trim()
.split(/\s+/)
.slice(0,2)
.map(x=>x[0])
.join("")
.toUpperCase()||"U";

}

function avatar(user){

if(user&&user.photo){

return `
<div class="avatar">
<img src="${esc(user.photo)}">
</div>
`;

}

return `
<div class="avatar">
${initials(user?.name)}
</div>
`;

}

function chatId(a,b){

return [a,b].sort().join("_");

}

).set({

/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(

}

await db.ref(
"users/"+user.uid
).update({

name:
user.displayName||
user.email.split("@")[0],

email:user.email,

lastSeen:
firebase.database.ServerValue.TIMESTAMP

});

"users/"+user.uid
)
.onDisconnect()
.update({

online:false,

lastSeen:
firebase.database.ServerValue.TIMESTAMP

});

class="userInfo"

user.online

}

'${user.uid}',

📞

</button>


<button

📹

/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(snapshot){

const box=$("messages");

if(!box)
return;


box.innerHTML="";


snapshot.forEach(child=>{

const message=
child.val();


const div=
document.createElement("div");


div.className=
"msg "+
(
message.from===currentUser.uid
?"mine"
:""
);


if(
message.type==="image"
){

div.innerHTML=`

<img
src="${esc(message.url)}">

`;

}else if(
message.type==="audio"
){

div.innerHTML=`

<audio
controls
src="${esc(message.url)}">
</audio>

`;

}else{

div.textContent=
message.text||"";

}


box.appendChild(div);

});


box.scrollTop=
box.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

const input=
$("message");

const text=
input.value.trim();


if(!text)
return;


input.value="";


await db.ref(

"chats/"+
chatId(
currentUser.uid,
selectedUser.uid
)+
"/messages"

).push({

from:currentUser.uid,

to:selectedUser.uid,

type:"text",

text:text,

time:
firebase.database.ServerValue.TIMESTAMP

});

}


/* =========================
   SEND IMAGE
========================= */

async function sendImage(){

const input=
document.createElement("input");

input.type="file";

input.accept="image/*";


input.onchange=
async()=>{

const file=
input.files[0];


if(!file)
return;


try{

const ref=
storage.ref(

"chat/"+
chatId(
currentUser.uid,
selectedUser.uid
)+
"/"+
Date.now()+
"_"+file.name

);


await ref.put(file);


const url=
await ref.getDownloadURL();


await db.ref(

"chats/"+
chatId(
currentUser.uid,
selectedUser.uid
)+
"/messages"

).push({

from:currentUser.uid,

to:selectedUser.uid,

type:"image",

url:url,

time:Date.now()

});


}catch(error){

alert(error.message);

}

};

}


/* =========================
   VOICE MESSAGE
========================= */

async function recordVoice(){

try{

const stream=
await navigator.mediaDevices
.getUserMedia({
audio:true
});


const recorder=
new MediaRecorder(stream);


const chunks=[];


recorder.ondataavailable=
event=>{

if(event.data.size){

chunks.push(
event.data
);

}

};


recorder.onstop=
async()=>{

stream
.getTracks()
.forEach(
track=>track.stop()
);


const blob=
new Blob(
chunks,
{
type:"audio/webm"
}
);


const ref=
storage.ref(

"voice/"+
chatId(
currentUser.uid,
selectedUser.uid
)+
"/"+
Date.now()+
".webm"

);


await ref.put(blob);


const url=
await ref.getDownloadURL();


await db.ref(

"chats/"+
chatId(
currentUser.uid,
selectedUser.uid
)+
"/messages"

).push({

from:currentUser.uid,

to:selectedUser.uid,

type:"audio",

url:url,

time:Date.now()

});

};


recorder.start();


alert(
"5 सेकंड की voice recording शुरू है।"
);


setTimeout(()=>{

if(
recorder.state==="recording"
){

recorder.stop();

}

},5000);


}catch(error){

alert(
"Microphone permission Allow करें।"
);

}

}

/* =========================
   CALL SYSTEM
========================= */

const rtcConfig={

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

/* =========================
   START CALL
========================= */

async function startCall(
uid,
type
){

if(rtc){

alert(
"पहले से call चल रही है।"
);

return;

}


try{

const user=
(
await db.ref(
"users/"+uid
).once("value")
).val();


localStream=
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:
type==="video"

});


currentCallId=
db.ref(
"calls"
).push().key;


rtc=
new RTCPeerConnection(
rtcConfig
);


localStream
.getTracks()
.forEach(
track=>{

rtc.addTrack(
track,
localStream
);

});


rtc.onicecandidate=
event=>{

if(
event.candidate
){

db.ref(

"calls/"+
currentCallId+
"/callerCandidates"

).push(

event.candidate.toJSON()

);

}

};


rtc.ontrack=
event=>{

const video=
$("remoteVideo");

if(video){

video.srcObject=
event.streams[0];

}

};


await db.ref(
"calls/"+currentCallId
).set({

caller:
currentUser.uid,

receiver:
uid,

callerName:
currentUser.displayName||
currentUser.email,

type:type,

status:
"ringing",

time:
Date.now()

});


const offer=
await rtc.createOffer();


await rtc.setLocalDescription(
offer
);


await db.ref(

"calls/"+
currentCallId+
"/offer"

).set({

type:offer.type,

sdp:offer.sdp

});


showCall(
user,
type,
"Calling..."
);


db.ref(

"calls/"+
currentCallId+
"/answer"

).on(
"value",
async snapshot=>{

if(

snapshot.exists()&&
rtc&&
!rtc.currentRemoteDescription

){

await rtc.setRemoteDescription(

new RTCSessionDescription(
snapshot.val()
)

);

}

}
);


db.ref(

"calls/"+
currentCallId+
"/calleeCandidates"

).on(

"child_added",

snapshot=>{

if(rtc){

rtc.addIceCandidate(

new RTCIceCandidate(
snapshot.val()
)

).catch(
()=>{}
);

}

}

);


}catch(error){

alert(
"Camera/Microphone permission Allow करें।"
);

endCall(false);

}

}

   INCOMING CALL
========================= */

function watchIncomingCalls(){

db.ref(
"calls"
).on(

"child_added",

async snapshot=>{

if(!currentUser)
return;


const call=
snapshot.val();


if(
!call||
call.receiver!==currentUser.uid||
call.status!=="ringing"
){

return;

}


const user=
(
await db.ref(
"users/"+call.caller
).once("value")
).val();


showIncoming(
snapshot.key,
call,
user
);

}

);

}

/* =========================
   ACCEPT CALL
========================= */

async function acceptCall(id){

try{

const call=
(
await db.ref(
"calls/"+id
).once("value")
).val();


if(!call)
return;


$("incoming")?.remove();


currentCallId=id;


const user=
(
await db.ref(
"users/"+call.caller
).once("value")
).val();


localStream=
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:
call.type==="video"

});


rtc=
new RTCPeerConnection(
rtcConfig
);


localStream
.getTracks()
.forEach(
track=>{

rtc.addTrack(
track,
localStream
);

});


rtc.onicecandidate=
event=>{

if(
event.candidate
){

db.ref(

"calls/"+
id+
"/calleeCandidates"

).push(

event.candidate.toJSON()

);

}

};


rtc.ontrack=
event=>{

const video=
$("remoteVideo");

if(video){

video.srcObject=
event.streams[0];

}

};


await rtc.setRemoteDescription(

new RTCSessionDescription(
call.offer
)

);


const answer=
await rtc.createAnswer();


await rtc.setLocalDescription(
answer
);


await db.ref(
"calls/"+id
).update({

answer:{

type:
answer.type,

sdp:
answer.sdp

},

status:
"connected"

});


db.ref(

"calls/"+
id+
"/callerCandidates"

).on(

"child_added",

snapshot=>{

rtc.addIceCandidate(

new RTCIceCandidate(
snapshot.val()
)

).catch(
()=>{}
);

}

);


showCall(
user,
call.type,
"Connected"
);


}catch(error){

alert(
error.message
);

endCall(false);

}

}


/* =========================
   CALL SCREEN
========================= */

function showCall(
user,
type,
status
){

$("callScreen")?.remove();


document.body.insertAdjacentHTML(

"beforeend",

`

<div
class="modal"
id="callScreen">

<div
class="modalBox">

${avatar(user)}

<h2>
${esc(user.name)}
</h2>

<p>
${status}
</p>


<video
id="remoteVideo"
autoplay
playsinline
${
type==="video"
?""
:"class='hidden'"
}>
</video>


<video
id="localVideo"
autoplay
muted
playsinline
${
type==="video"
?""
:"class='hidden'"
}>
</video>


<div class="row">

<button
class="icon endBtn"
onclick="endCall()">

☎

</button>

</div>

</div>

</div>

`

);


const local=
$("localVideo");


if(
local&&
localStream
){

local.srcObject=
localStream;

}

}


/* =========================
   REJECT CALL
========================= */

async function rejectCall(id){

await db.ref(
"calls/"+id
).update({

status:
"rejected"

});


$("incoming")?.remove();

}


/* =========================
   END CALL
========================= */

async function endCall(
write=true
){

if(
write&&
currentCallId
){

await db.ref(
"calls/"+currentCallId
).update({

status:
"ended"

});

}


if(localStream){

localStream
.getTracks()
.forEach(
track=>track.stop()
);

}


if(rtc){

rtc.close();

rtc=null;

}


localStream=null;

currentCallId=null;

$("callScreen")?.remove();

}


/* =========================
   GLOBAL
========================= */

window.showHome=
showHome;

window.openChat=
openChat;

window.startCall=
startCall;

window.acceptCall=
acceptCall;

window.rejectCall=
rejectCall;

window.endCall=
endCall;

</script>

</body>
