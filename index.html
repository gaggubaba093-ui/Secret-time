<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06131d;color:#fff;font-family:Arial}
button,input{font:inherit}button{cursor:pointer}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(400px,100%);background:#09202d;border:1px solid #08c8ff;border-radius:22px;padding:24px}
h1{text-align:center}.sub{text-align:center;color:#9bb0bd}
input{width:100%;height:48px;margin:7px 0;padding:0 14px;border-radius:11px;border:1px solid #174c67;background:#06131d;color:#fff}
.primary{width:100%;height:48px;border:0;border-radius:11px;background:#00bfa5;color:#fff;font-weight:bold}
.err{text-align:center;color:#ff6875;min-height:25px}
#app{display:none;height:100vh}
.head{height:70px;display:flex;align-items:center;padding:9px 12px;background:#09202d;border-bottom:1px solid #16485e}
.title{flex:1;margin-left:10px}.title b{font-size:19px}.title small{display:block;color:#91aabd}
.icon{width:42px;height:42px;margin-left:5px;border:1px solid #15516e;border-radius:10px;background:#0b2939;color:#fff}
.search{padding:8px}.search input{margin:0;border-radius:24px}
.stories{display:flex;gap:10px;padding:9px;overflow:auto;border-bottom:1px solid #16485e}
.story{min-width:68px;text-align:center;font-size:11px}.circle,.add{width:60px;height:60px;border-radius:50%;margin:auto}.circle{object-fit:cover;border:3px solid #08c8ff;padding:2px}.add{display:grid;place-items:center;border:2px dashed #08c8ff;font-size:26px}
.users{height:calc(100vh - 230px);overflow:auto}
.user{height:75px;display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid #103746}
.avatar{width:53px;height:53px;border-radius:50%;background:#103144;border:2px solid #08c8ff;display:grid;place-items:center;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.userInfo{margin-left:11px;flex:1}.userInfo small{color:#91aabd}
#chat{display:none;position:fixed;inset:0;background:#06131d;z-index:20;flex-direction:column}
.chatHead{height:70px;display:flex;align-items:center;padding:8px;background:#09202d}
.back{font-size:30px;background:none;border:0;color:#fff;width:40px}.chatName{flex:1;margin-left:8px}.chatName small{display:block;color:#91aabd}
.messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:82%;background:#173246;padding:9px;border-radius:14px;align-self:flex-start;word-break:break-word}.mine{align-self:flex-end;background:#007c69}.msg img,.msg video{max-width:100%;border-radius:8px}.msg audio{max-width:240px}.time{text-align:right;font-size:9px;color:#bfd0d7;margin-top:4px}
.compose{display:flex;gap:5px;padding:7px;background:#09202d}.compose input{margin:0;flex:1}.round{width:42px;height:42px;border-radius:50%;border:1px solid #15516e;background:#0b2939;color:#fff}.send{width:46px;height:46px;border:0;border-radius:50%;background:#00bfa5;color:#fff}
.viewer{display:none;position:fixed;inset:0;background:#000;z-index:50;align-items:center;justify-content:center}.viewer img,.viewer video{max-width:100%;max-height:100%}.close{position:absolute;right:15px;top:15px;background:#ffffff22;color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:22px}
</style>
</head>
<body>

<div id="auth">
<div class="box">
<h1>💬 Secret Chat</h1>
<p class="sub">Create your account and start chatting</p>

<div id="signup">
<input id="name" placeholder="Your Name">
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button class="primary" onclick="signup()">Create Account</button>
<p class="sub">Already have an account?
<button onclick="showLogin()" style="background:none;border:0;color:#08c8ff">Login</button></p>
</div>

<div id="loginForm" style="display:none">
<input id="lemail" type="email" placeholder="Email">
<input id="lpass" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login</button>
<p class="sub">New user?
<button onclick="showSignup()" style="background:none;border:0;color:#08c8ff">Sign Up</button></p>
</div>

<div id="err" class="err"></div>
</div>
</div>

<div id="app">
<div class="head">
<div class="avatar" id="myAvatar">U</div>
<div class="title"><b>Secret Chat</b><small id="myStatus">Online</small></div>
<button class="icon" onclick="logout()">↪</button>
</div>

<div class="search">
<input id="search" placeholder="🔍 Search users" oninput="filterUsers()">
</div>

<div id="stories" class="stories"></div>
<div id="users" class="users"></div>
</div>

<div id="chat">
<div class="chatHead">
<button class="back" onclick="closeChat()">‹</button>
<div class="avatar" id="chatAvatar">U</div>
<div class="chatName"><b id="chatTitle"></b><small>🟢 Chat</small></div>
</div>

<div id="messages" class="messages"></div>

<form class="compose" onsubmit="sendText(event)">
<button type="button" class="round" onclick="mediaInput.click()">📷</button>
<button type="button" class="round" onclick="fileInput.click()">📎</button>
<button type="button" class="round" onclick="recordVoice()">🎤</button>
<input id="message" placeholder="Message...">
<button class="send">➤</button>

<input id="mediaInput" type="file" accept="image/*,video/*" hidden onchange="sendMedia(this)">
<input id="fileInput" type="file" hidden onchange="sendFile(this)">
</form>
</div>

<div id="viewer" class="viewer">
<button class="close" onclick="closeStory()">✕</button>
<div id="storyContent"></div>
</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
updateProfile,
signOut
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getDatabase,ref,set,push,onValue,onChildAdded
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import{
getStorage,ref as sref,uploadBytes,getDownloadURL
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* YOUR EXISTING FIREBASE PROJECT */

const firebaseConfig={
apiKey:"AIzaSyB7B00ndag8PE78pjLxFg4iok9-9_U5bz0",
authDomain:"secret-frame-698ba.firebaseapp.com",
databaseURL:"https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"secret-frame-698ba",
storageBucket:"secret-frame-698ba.firebasestorage.app",
messagingSenderId:"601470862803",
appId:"1:601470862803:web:3b666e06133804609b9b26"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const storage=getStorage(app);

let me=null;
let selected=null;
let stopChat=null;


/* AUTH */

window.showLogin=()=>{
signup.style.display="none";
loginForm.style.display="block";
err.textContent="";
};

window.showSignup=()=>{
signup.style.display="block";
loginForm.style.display="none";
err.textContent="";
};

window.signup=async()=>{

try{

const n=name.value.trim();
const e=email.value.trim();
const p=pass.value;

if(!n||!e||p.length<6){
err.textContent="नाम, email और कम से कम 6 अक्षर का password डालें।";
return;
}

const result=
await createUserWithEmailAndPassword(auth,e,p);

await updateProfile(result.user,{displayName:n});

await set(ref(db,"users/"+result.user.uid),{
uid:result.user.uid,
name:n,
email:e,
online:true,
createdAt:Date.now()
});

err.textContent="Account बन गया।";

}catch(e){
err.textContent=e.message;
}

};


window.login=async()=>{

try{
await signInWithEmailAndPassword(
auth,
lemail.value.trim(),
lpass.value
);
}catch(e){
err.textContent=e.message;
}

};


window.logout=async()=>{
await signOut(auth);
};


/* AUTH STATE */

onAuthStateChanged(auth,user=>{

if(user){

me=user;

auth.style.display="none";
app.style.display="block";

set(
ref(db,"users/"+user.uid+"/online"),
true
);

loadMyProfile();
loadUsers();
loadStories();

}else{

auth.style.display="grid";
app.style.display="none";

}

});


/* PROFILE */

function loadMyProfile(){

const n=me.displayName||"User";
myAvatar.textContent=n.substring(0,2).toUpperCase();

};


/* USERS */

function loadUsers(){

onValue(ref(db,"users"),snap=>{

users.innerHTML="";

const data=snap.val()||{};

Object.values(data).forEach(u=>{

if(u.uid===me.uid)return;

const row=document.createElement("div");
row.className="user";
row.dataset.name=(u.name||"").toLowerCase();

row.innerHTML=`
<div class="avatar">
${(u.name||"U").substring(0,2).toUpperCase()}
</div>
<div class="userInfo">
<b>${escapeText(u.name||"User")}</b>
<small>${u.online?"🟢 Online":"⚫ Offline"}</small>
</div>
`;

row.onclick=()=>openChat(u);
users.appendChild(row);

});

});

}


/* SEARCH */

window.filterUsers=()=>{
const q=search.value.toLowerCase();

document.querySelectorAll(".user").forEach(x=>{
x.style.display=x.dataset.name.includes(q)?"flex":"none";
});
};


/* CHAT */

function chatId(a,b){
return[a,b].sort().join("_");
}

function openChat(u){

selected=u;

chat.style.display="flex";
chatTitle.textContent=u.name;
chatAvatar.textContent=(u.name||"U").substring(0,2).toUpperCase();

loadMessages();

}

function loadMessages(){

messages.innerHTML="";

if(stopChat)stopChat();

stopChat=onChildAdded(
ref(db,"chats/"+chatId(me.uid,selected.uid)),
snap=>{

const m=snap.val();
const div=document.createElement("div");

div.className="msg "+(m.sender===me.uid?"mine":"");

if(m.type==="image"){
div.innerHTML=`<img src="${m.url}"><div class="time">${tm(m.time)}</div>`;
}
else if(m.type==="video"){
div.innerHTML=`<video src="${m.url}" controls playsinline></video><div class="time">${tm(m.time)}</div>`;
}
else if(m.type==="audio"){
div.innerHTML=`<audio src="${m.url}" controls></audio><div class="time">${tm(m.time)}</div>`;
}
else if(m.type==="file"){
div.innerHTML=`<a href="${m.url}" target="_blank" style="color:white">📎 ${escapeText(m.name||"File")}</a><div class="time">${tm(m.time)}</div>`;
}
else{
div.textContent=m.text||"";
const t=document.createElement("div");
t.className="time";
t.textContent=tm(m.time);
div.appendChild(t);
}

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;

});

}

window.closeChat=()=>{
if(stopChat)stopChat();
chat.style.display="none";
selected=null;
};


/* TEXT */

window.sendText=async e=>{

e.preventDefault();

if(!selected)return;

const text=message.value.trim();

if(!text)return;

await push(
ref(db,"chats/"+chatId(me.uid,selected.uid)),
{
sender:me.uid,
text,
type:"text",
time:Date.now()
}
);

message.value="";

};


/* MEDIA */

async function upload(file,type){

if(!selected)return;

try{

const path=
"uploads/"+chatId(me.uid,selected.uid)+"/"+
Date.now()+"_"+file.name;

const r=sref(storage,path);

await uploadBytes(r,file);

const url=await getDownloadURL(r);

await push(
ref(db,"chats/"+chatId(me.uid,selected.uid)),
{
sender:me.uid,
type,
url,
name:file.name,
time:Date.now()
}
);

}catch(e){
alert("Upload failed: "+e.message);
}

}

window.sendMedia=input=>{

const f=input.files[0];
if(!f)return;

upload(
f,
f.type.startsWith("video/")?"video":"image"
);

input.value="";
};

window.sendFile=input=>{

const f=input.files[0];
if(!f)return;

upload(f,"file");
input.value="";
};


/* VOICE */

window.recordVoice=async()=>{

if(!selected)return;

try{

const stream=
await navigator.mediaDevices.getUserMedia({audio:true});

const rec=new MediaRecorder(stream);
const chunks=[];

rec.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};

rec.onstop=()=>{

stream.getTracks().forEach(x=>x.stop());

const blob=new Blob(chunks,{type:"audio/webm"});

const file=new File(
[blob],
"voice-"+Date.now()+".webm",
{type:"audio/webm"}
);

upload(file,"audio");

};

rec.start();

alert("🎤 Recording 5 seconds...");

setTimeout(()=>rec.stop(),5000);

}catch(e){
alert("Microphone permission दें।");
}

};


/* STORIES */

function loadStories(){

stories.innerHTML="";

const add=document.createElement("div");
add.className="story";
add.innerHTML=`<div class="add">+</div><div>My Story</div>`;

add.onclick=()=>{

const i=document.createElement("input");
i.type="file";
i.accept="image/*,video/*";

i.onchange=()=>{
if(i.files[0])uploadStory(i.files[0]);
};

i.click();

};

stories.appendChild(add);

onValue(ref(db,"stories"),snap=>{

Object.values(snap.val()||{}).forEach(s=>{

if(Date.now()-s.time>86400000)return;

const item=document.createElement("div");
item.className="story";

item.innerHTML=`
<img class="circle" src="${s.url}">
<div>${escapeText(s.name)}</div>
`;

item.onclick=()=>viewStory(s);

stories.appendChild(item);

});

});

}


async function uploadStory(file){

try{

const r=sref(
storage,
"stories/"+me.uid+"/"+Date.now()+"_"+file.name
);

await uploadBytes(r,file);

const url=await getDownloadURL(r);

await push(ref(db,"stories"),{
owner:me.uid,
name:me.displayName||"User",
url,
type:file.type.startsWith("video/")?"video":"image",
time:Date.now()
});

}catch(e){
alert("Story upload failed: "+e.message);
}

}


function viewStory(s){

storyContent.innerHTML="";

if(s.type==="video"){

const v=document.createElement("video");
v.src=s.url;
v.controls=true;
v.autoplay=true;
v.playsInline=true;
storyContent.appendChild(v);

}else{

const i=document.createElement("img");
i.src=s.url;
storyContent.appendChild(i);

}

viewer.style.display="flex";

}

window.closeStory=()=>{
viewer.style.display="none";
storyContent.innerHTML="";
};


/* HELPERS */

function tm(t){
return new Date(t||Date.now()).toLocaleTimeString(
[],
{hour:"2-digit",minute:"2-digit"}
);
}

function escapeText(x){
return String(x)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

</script>
</body>
</html>
