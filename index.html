<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  updateProfile,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyB7B00ndag8PE78pjLxFg4iok9-9_U5bz0",
  authDomain: "secret-frame-698ba.firebaseapp.com",
  databaseURL: "https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "secret-frame-698ba",
  storageBucket: "secret-frame-698ba.firebasestorage.app",
  messagingSenderId: "601470862803",
  appId: "1:601470862803:web:3b666e06133804609b9b26"
};

const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);
const storage = getStorage(firebaseApp);


/* STATE */

let currentUser = null;
let selectedUser = null;
let stopChatListener = null;


/* DOM */

const authPage = document.getElementById("auth");
const appPage = document.getElementById("app");
const signupBox = document.getElementById("signup");
const loginBox = document.getElementById("loginForm");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("pass");

const loginEmailInput = document.getElementById("lemail");
const loginPasswordInput = document.getElementById("lpass");

const errorBox = document.getElementById("err");

const usersBox = document.getElementById("users");
const storiesBox = document.getElementById("stories");

const chatBox = document.getElementById("chat");
const messagesBox = document.getElementById("messages");
const messageInput = document.getElementById("message");

const chatTitle = document.getElementById("chatTitle");
const chatAvatar = document.getElementById("chatAvatar");

const searchInput = document.getElementById("search");

const mediaInput = document.getElementById("mediaInput");
const fileInput = document.getElementById("fileInput");

const viewer = document.getElementById("viewer");
const storyContent = document.getElementById("storyContent");

const myAvatar = document.getElementById("myAvatar");
const myStatus = document.getElementById("myStatus");


/* SIGN UP */

window.signup = async function () {

  errorBox.textContent = "";

  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!name) {
    errorBox.textContent = "अपना नाम डालें।";
    return;
  }

  if (!email) {
    errorBox.textContent = "अपना Email डालें।";
    return;
  }

  if (!password) {
    errorBox.textContent = "Password डालें।";
    return;
  }

  if (password.length < 6) {
    errorBox.textContent =
      "Password कम से कम 6 अक्षर का होना चाहिए।";
    return;
  }

  try {

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(
      result.user,
      {
        displayName: name
      }
    );

    await set(
      ref(db, "users/" + result.user.uid),
      {
        uid: result.user.uid,
        name: name,
        email: email,
        online: true,
        createdAt: Date.now()
      }
    );

    errorBox.style.color = "#00e5a0";
    errorBox.textContent =
      "✅ Account बन गया। Login हो रहा है...";

  } catch (error) {

    console.error(error);

    errorBox.style.color = "#ff6875";

    if (error.code === "auth/email-already-in-use") {
      errorBox.textContent =
        "यह Email पहले से registered है।";
    }
    else if (error.code === "auth/invalid-email") {
      errorBox.textContent =
        "Email सही नहीं है।";
    }
    else if (error.code === "auth/weak-password") {
      errorBox.textContent =
        "Password बहुत कमजोर है।";
    }
    else {
      errorBox.textContent =
        error.message;
    }

  }

};


/* LOGIN PAGE */

window.showLogin = function () {

  signupBox.style.display = "none";
  loginBox.style.display = "block";

  errorBox.textContent = "";
  errorBox.style.color = "#ff6875";

};


window.showSignup = function () {

  signupBox.style.display = "block";
  loginBox.style.display = "none";

  errorBox.textContent = "";

};


/* LOGIN */

window.login = async function () {

  errorBox.textContent = "";

  const email =
    loginEmailInput.value.trim();

  const password =
    loginPasswordInput.value.trim();

  if (!email) {
    errorBox.textContent =
      "Email डालें।";
    return;
  }

  if (!password) {
    errorBox.textContent =
      "Password डालें।";
    return;
  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (error) {

    console.error(error);

    errorBox.textContent =
      "Login failed: " +
      error.message;

  }

};


/* AUTH STATE */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser = user;

      authPage.style.display = "none";
      appPage.style.display = "block";

      const userName =
        user.displayName || "User";

      myAvatar.textContent =
        userName
        .substring(0, 2)
        .toUpperCase();

      myStatus.textContent =
        "🟢 Online";

      await set(
        ref(
          db,
          "users/" +
          user.uid +
          "/online"
        ),
        true
      );

      loadUsers();
      loadStories();

    } else {

      currentUser = null;

      authPage.style.display = "grid";
      appPage.style.display = "none";
      chatBox.style.display = "none";

    }

  }
);


/* LOGOUT */

window.logout = async function () {

  if (currentUser) {

    await set(
      ref(
        db,
        "users/" +
        currentUser.uid +
        "/online"
      ),
      false
    );

  }

  await signOut(auth);

};


/* USERS */

function loadUsers() {

  onValue(
    ref(db, "users"),
    (snapshot) => {

      usersBox.innerHTML = "";

      const data =
        snapshot.val() || {};

      Object.values(data).forEach(
        (user) => {

          if (
            !currentUser ||
            user.uid === currentUser.uid
          ) {
            return;
          }

          const row =
            document.createElement("div");

          row.className = "user";

          row.dataset.name =
            (user.name || "")
            .toLowerCase();

          const avatarText =
            (user.name || "U")
            .substring(0, 2)
            .toUpperCase();

          row.innerHTML = `
            <div class="avatar">
              ${escapeHTML(avatarText)}
            </div>

            <div class="userInfo">
              <b>${escapeHTML(user.name || "User")}</b>
              <small>
                ${user.online ? "🟢 Online" : "⚫ Offline"}
              </small>
            </div>
          `;

          row.onclick =
            () => openChat(user);

          usersBox.appendChild(row);

        }
      );

    }
  );

}


/* SEARCH */

window.filterUsers = function () {

  const search =
    searchInput.value
    .trim()
    .toLowerCase();

  document
    .querySelectorAll(".user")
    .forEach(
      (user) => {

        user.style.display =
          user.dataset.name
          .includes(search)
          ? "flex"
          : "none";

      }
    );

};


/* CHAT ID */

function getChatId(a, b) {

  return [a, b]
    .sort()
    .join("_");

}


/* OPEN CHAT */

function openChat(user) {

  selectedUser = user;

  chatBox.style.display = "flex";

  chatTitle.textContent =
    user.name || "User";

  chatAvatar.textContent =
    (user.name || "U")
    .substring(0, 2)
    .toUpperCase();

  loadMessages();

}


/* MESSAGES */

function loadMessages() {

  messagesBox.innerHTML = "";

  if (stopChatListener) {
    stopChatListener();
    stopChatListener = null;
  }

  const id =
    getChatId(
      currentUser.uid,
      selectedUser.uid
    );

  stopChatListener =
    onChildAdded(
      ref(db, "chats/" + id),
      (snapshot) => {

        const data =
          snapshot.val();

        if (!data) return;

        const message =
          document.createElement("div");

        message.className =
          "msg " +
          (
            data.sender ===
            currentUser.uid
            ? "mine"
            : ""
          );

        if (data.type === "image") {

          message.innerHTML = `
            <img
              src="${data.url}"
              alt="photo">
            <div class="time">
              ${timeText(data.time)}
            </div>
          `;

        }

        else if (data.type === "video") {

          message.innerHTML = `
            <video
              src="${data.url}"
              controls
              playsinline>
            </video>

            <div class="time">
              ${timeText(data.time)}
            </div>
          `;

        }

        else if (data.type === "audio") {

          message.innerHTML = `
            <audio
              src="${data.url}"
              controls>
            </audio>

            <div class="time">
              ${timeText(data.time)}
            </div>
          `;

        }

        else if (data.type === "file") {

          message.innerHTML = `
            <a
              href="${data.url}"
              target="_blank"
              style="color:white">
              📎 ${escapeHTML(data.name || "File")}
            </a>

            <div class="time">
              ${timeText(data.time)}
            </div>
          `;

        }

        else {

          message.textContent =
            data.text || "";

          const time =
            document.createElement("div");

          time.className = "time";

          time.textContent =
            timeText(data.time);

          message.appendChild(time);

        }

        messagesBox.appendChild(
          message
        );

        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      }
    );

}


/* CLOSE CHAT */

window.closeChat = function () {

  if (stopChatListener) {
    stopChatListener();
    stopChatListener = null;
  }

  selectedUser = null;

  chatBox.style.display = "none";

};


/* SEND TEXT */

window.sendText = async function (event) {

  event.preventDefault();

  if (
    !currentUser ||
    !selectedUser
  ) {
    return;
  }

  const text =
    messageInput.value.trim();

  if (!text) return;

  const id =
    getChatId(
      currentUser.uid,
      selectedUser.uid
    );

  await push(
    ref(db, "chats/" + id),
    {
      sender: currentUser.uid,
      receiver: selectedUser.uid,
      type: "text",
      text: text,
      time: Date.now()
    }
  );

  messageInput.value = "";

};


/* UPLOAD */

async function uploadFile(
  file,
  type
) {

  if (
    !currentUser ||
    !selectedUser ||
    !file
  ) {
    return;
  }

  try {

    const id =
      getChatId(
        currentUser.uid,
        selectedUser.uid
      );

    const path =
      "uploads/" +
      id +
      "/" +
      Date.now() +
      "_" +
      file.name;

    const fileRef =
      storageRef(
        storage,
        path
      );

    await uploadBytes(
      fileRef,
      file
    );

    const url =
      await getDownloadURL(
        fileRef
      );

    await push(
      ref(db, "chats/" + id),
      {
        sender: currentUser.uid,
        receiver: selectedUser.uid,
        type: type,
        url: url,
        name: file.name,
        time: Date.now()
      }
    );

  } catch (error) {

    console.error(error);

    alert(
      "File upload failed: " +
      error.message
    );

  }

}


/* PHOTO / VIDEO */

window.sendMedia = function (input) {

  const file =
    input.files &&
    input.files[0];

  if (!file) return;

  const type =
    file.type.startsWith("video/")
    ? "video"
    : "image";

  uploadFile(
    file,
    type
  );

  input.value = "";

};


/* FILE */

window.sendFile = function (input) {

  const file =
    input.files &&
    input.files[0];

  if (!file) return;

  uploadFile(
    file,
    "file"
  );

  input.value = "";

};


/* VOICE */

window.recordVoice =
async function () {

  if (!selectedUser) {
    alert("पहले कोई user खोलें।");
    return;
  }

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    alert(
      "इस browser में microphone उपलब्ध नहीं है।"
    );
    return;
  }

  try {

    const stream =
      await navigator.mediaDevices
      .getUserMedia({
        audio: true
      });

    const recorder =
      new MediaRecorder(stream);

    const chunks = [];

    recorder.ondataavailable =
      (event) => {

        if (event.data.size) {
          chunks.push(
            event.data
          );
        }

      };

    recorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

        const blob =
          new Blob(
            chunks,
            {
              type:
                "audio/webm"
            }
          );

        const file =
          new File(
            [blob],
            "voice.webm",
            {
              type:
                "audio/webm"
            }
          );

        uploadFile(
          file,
          "audio"
        );

      };

    recorder.start();

    alert(
      "🎤 5 सेकंड recording..."
    );

    setTimeout(
      () => recorder.stop(),
      5000
    );

  } catch (error) {

    alert(
      "Microphone permission Allow करें।"
    );

  }

};


/* STORIES */

function loadStories() {

  storiesBox.innerHTML = "";

  const addStory =
    document.createElement("div");

  addStory.className =
    "story";

  addStory.innerHTML = `
    <div class="add">+</div>
    <div>My Story</div>
  `;

  addStory.onclick =
    () => {

      const input =
        document.createElement("input");

      input.type = "file";

      input.accept =
        "image/*,video/*";

      input.onchange =
        () => {

          if (
            input.files &&
            input.files[0]
          ) {

            uploadStory(
              input.files[0]
            );

          }

        };

      input.click();

    };

  storiesBox.appendChild(
    addStory
  );


  onValue(
    ref(db, "stories"),
    (snapshot) => {

      const data =
        snapshot.val() || {};

      Object.values(data)
        .forEach(
          (story) => {

            if (
              Date.now() -
              story.time >
              86400000
            ) {
              return;
            }

            const item =
              document.createElement("div");

            item.className =
              "story";

            item.innerHTML = `
              <img
                class="circle"
                src="${story.url}">
              <div>
                ${escapeHTML(
                  story.name || "User"
                )}
              </div>
            `;

            item.onclick =
              () => viewStory(story);

            storiesBox.appendChild(
              item
            );

          }
        );

    }
  );

}


/* STORY UPLOAD */

async function uploadStory(file) {

  try {

    const path =
      "stories/" +
      currentUser.uid +
      "/" +
      Date.now() +
      "_" +
      file.name;

    const fileRef =
      storageRef(
        storage,
        path
      );

    await uploadBytes(
      fileRef,
      file
    );

    const url =
      await getDownloadURL(
        fileRef
      );

    await push(
      ref(db, "stories"),
      {
        owner:
          currentUser.uid,

        name:
          currentUser.displayName ||
          "User",

        url: url,

        type:
          file.type.startsWith("video/")
          ? "video"
          : "image",

        time:
          Date.now()
      }
    );

    alert(
      "✅ Story uploaded"
    );

  } catch (error) {

    alert(
      "Story upload failed: " +
      error.message
    );

  }

}


/* VIEW STORY */

function viewStory(story) {

  storyContent.innerHTML = "";

  if (
    story.type ===
    "video"
  ) {

    const video =
      document.createElement("video");

    video.src =
      story.url;

    video.controls =
      true;

    video.autoplay =
      true;

    video.playsInline =
      true;

    storyContent.appendChild(
      video
    );

  } else {

    const image =
      document.createElement("img");

    image.src =
      story.url;

    storyContent.appendChild(
      image
    );

  }

  viewer.style.display =
    "flex";

}


window.closeStory =
function () {

  viewer.style.display =
    "none";

  storyContent.innerHTML =
    "";

};


/* HELPERS */

function timeText(time) {

  return new Date(
    time || Date.now()
  ).toLocaleTimeString(
    [],
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>
